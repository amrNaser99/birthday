<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>كارت أجمل صدفة في عمري</title>
  <link rel="stylesheet" href="print-card.css">
</head>
<body>
  <main class="card" aria-label="كارت هدية أجمل صدفة في عمري">
    <div class="stars" aria-hidden="true"></div>
    <div class="monogram">A<span>♥</span>M</div>
    <p class="overline">Our little forever</p>
    <h1>عيد ميلاد سعيد<br>يا مُنّش</h1>
    <p class="message">في مفاجأة مخصوص ليكي…<br>امسحي الكود وافتحي هديتك.</p>
    <div class="qr-frame">
      <img src="assets/qr-code.png" alt="QR Code لفتح حكايتنا">
      <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
    </div>
    <p class="scan">SCAN ME <span>♥</span></p>
    <div class="date">14 · 11 · 2026</div>
    <p class="signature">من عمرو… بكل الحب</p>
  </main>
</body>
</html>
